<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>匯入檢視 · PACE 校園運動</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body data-page="review">
    <div class="site-shell subpage-shell">
      <header class="topbar">
        <div class="brand" aria-label="PACE 校園運動首頁">
          <div class="brand-mark">PACE</div>
          <div class="brand-copy">
            <span class="brand-name">PACE</span>
            <span class="brand-sub">校園運動</span>
          </div>
        </div>
        <nav class="main-nav" aria-label="主選單">
          <a href="index.html">首頁</a>
          <a href="index.html#exercise">開始運動</a>
          <a href="index.html#history">運動紀錄</a>
          <a href="handout.html">學習中心</a>
        </nav>
      </header>

      <main class="subpage page-wrap">
        <section class="subpage-hero">
          <div>
            <p class="eyebrow">REVIEW PANEL</p>
            <h1>匯入檢視</h1>
          </div>
          <a href="index.html" class="secondary action-btn">回首頁</a>
        </section>

        <section class="review-grid">
          <div class="panel-box">
            <div class="panel-header">
              <h2>資料匯入</h2>
            </div>
            <div class="import-actions">
              <label class="upload-box" for="csv-upload">
                <input id="csv-upload" type="file" accept=".csv,text/csv" />
                <span>選擇 CSV 檔案</span>
              </label>
              <button id="demo-import" class="primary action-btn" type="button">載入示範資料</button>
            </div>
            <p class="helper-text">支援匯入 CSV 中的日期、距離與時間欄位，並顯示在歷史紀錄中。</p>
          </div>

          <div class="panel-box">
            <div class="panel-header">
              <h2>匯入紀錄</h2>
            </div>
            <div id="review-list" class="review-list">
              <p class="empty-message">尚未匯入任何紀錄。</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
